<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>When Working JavaScript Breaks</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/lab.js"></script>
    <script src="/account.js" defer></script>
  </head>
  <body>
    <main class="lab">
      <form id="controls" class="toolbar">
        <fieldset class="toggle" aria-label="Response headers">
          <label
            ><input
              type="radio"
              name="policy"
              value="permissive"
              checked
            />Permissive</label
          >
          <label
            ><input
              type="radio"
              name="policy"
              value="restricted"
            />Restricted</label
          >
        </fieldset>
        <fieldset class="toggle" aria-label="Build">
          <label
            ><input
              type="radio"
              name="build"
              value="eval"
              checked
            />eval-source-map</label
          >
          <label
            ><input type="radio" name="build" value="fixed" />source-map</label
          >
        </fieldset>
      </form>
      <section class="account" aria-label="Account demo">
        <div class="account-heading">Your account</div>
        <div class="profile">
          <div class="avatar" aria-hidden="true">E</div>
          <div>
            <h1 id="current-name">Elena</h1>
            <p>elena@example.com</p>
          </div>
        </div>
        <p class="account-copy">
          Your profile is visible to people in your workspace.
        </p>
        <button id="open-dialog">Change display name</button>
        <p id="account-status" role="status">Account ready</p>
      </section>
    </main>
    <dialog id="profile-dialog" aria-labelledby="dialog-title">
      <form method="dialog" id="profile-form">
        <h2 id="dialog-title">Change display name</h2>
        <label for="display-name">Display name</label
        ><input
          id="display-name"
          name="name"
          maxlength="60"
          autocomplete="nickname"
          required
        />
        <div class="dialog-actions">
          <button type="button" id="cancel" class="secondary">Cancel</button
          ><button type="submit">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
