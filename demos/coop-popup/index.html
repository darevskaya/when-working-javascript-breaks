<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COOP: popup login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="lab demo-index">
      <h1>COOP: popup login</h1>
        <p>
          Open a mode, click <strong>Sign in</strong>, then click
          <strong>Continue as Elena</strong> in the Orbit ID popup.
        </p>
      <ul>
        <li>
            <a href="/demo/coop-popup/no-coop" target="_blank"
              >1. No COOP: login works</a
          >
          Neither page sends COOP.
        </li>
        <li>
            <a href="/demo/coop-popup/with-coop" target="_blank"
              >2. COOP on the login page: login never finishes</a
          >
          The Orbit ID login sends
          <code>Cross-Origin-Opener-Policy: same-origin</code>
        </li>
      </ul>
    </main>
  </body>
</html>
