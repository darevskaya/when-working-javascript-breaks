<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Popup login: COOP</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="lab demo-index">
      <h1>Popup login: COOP</h1>
      <p>Each link opens one mode of this demo in a new tab.</p>
      <ul>
        <li>
          <a href="/demo/coop/permissive" target="_blank">Works</a>
          Neither page sends COOP.
        </li>
        <li>
          <a href="/demo/coop/host-coop" target="_blank">Breaks</a>
          The app page sends
          <code>Cross-Origin-Opener-Policy: same-origin</code>
        </li>
        <li>
          <a href="/demo/coop/restricted" target="_blank">Breaks</a>
          The provider sends
          <code>Cross-Origin-Opener-Policy: same-origin</code>
        </li>
      </ul>
    </main>
  </body>
</html>
