<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embedded Orbit ID frame</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/host-page.css" />
    <script type="module" src="/host-page.js"></script>
  </head>
  <body>
    <main class="lab">
      <section class="demo-panel" aria-labelledby="page-title">
        <h1 id="page-title">Embedded Orbit ID frame</h1>
        <!-- The Orbit ID frame goes here. -->
        <section id="orbit-slot" aria-label="Sign in"></section>

        <pre><code id="embed-code"></code></pre>
        <p id="status" role="status">Loading the Orbit ID frame…</p>
      </section>
