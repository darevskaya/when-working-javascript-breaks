<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order summary</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/app.css" />
    <!--
      One page for all three routes. The script URL is relative, so the two
      plain routes load the source app.js, and the route under /bundle/ loads
      the webpack build. See the route table in server.js.
    -->
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="lab">
      <section class="demo-panel" aria-labelledby="summary-title">
        <h1 id="summary-title">Order summary</h1>
        <dl class="summary">
          <dt>Items</dt>
          <dd data-template>{{ data.lines.length }}</dd>
          <dt>Subtotal</dt>
          <dd data-template>${{ data.subtotal().toFixed(2) }}</dd>
          <dt>Delivery</dt>
          <dd data-template>{{ data.delivery() ? '$4.90' : 'Free' }}</dd>
          <dt>Total</dt>
          <dd data-template>${{ data.total().toFixed(2) }}</dd>
        </dl>
      </section>
    </main>
  </body>
</html>
