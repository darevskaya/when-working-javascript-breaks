<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markup preview</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="lab">
      <section class="demo-panel" aria-labelledby="page-title">
        <h1 id="page-title">Markup preview</h1>
        <p>
          Each renderer receives one product label containing an HTML tag. The
          result shows whether that tag becomes markup or stays text.
        </p>
        <section
          class="preview-slot"
          aria-label="Product label preview"
          data-preview
          data-label="Fern &amp; Co. &lt;em&gt;SALE&lt;/em&gt;"
        >
          <p class="preview-loading">Rendering preview…</p>
        </section>
        <p>Style: <code id="style">…</code></p>
        <p id="status">Rendering…</p>
      </section>
    </main>
  </body>
</html>
