# The same policy as option B in eslint.config.js, as a Semgrep rule.
rules:
  - id: trusted-types-markup-sink
    languages: [javascript]
    severity: ERROR
    message: >-
      require-trusted-types-for 'script' refuses every string in this markup
      sink, also a constant or an escaped string. Write the markup through
      setHTML() from trusted-html, or build the nodes with DOM APIs and
      textContent.
    # setHTML() in this folder owns the policy, so it writes the markup.
    paths:
      exclude:
        - trusted-html/*
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.innerHTML += $X
      - pattern: $EL.outerHTML = $X
      - pattern: $EL.srcdoc = $X
      - pattern: $EL.insertAdjacentHTML(...)
      - pattern: $EL.setHTMLUnsafe(...)
      - pattern: document.write(...)
      - pattern: document.writeln(...)
