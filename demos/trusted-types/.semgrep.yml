# The same policy as eslint.config.js, as a Semgrep rule.
rules:
  - id: trusted-types-markup-sink
    languages: [javascript]
    severity: ERROR
    message: >-
      require-trusted-types-for 'script' blocks every string in this markup
      sink, also a constant or escaped string. Build the markup with DOM APIs
      and textContent, or write it through setHTML() from trusted-html.
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.innerHTML += $X
          - pattern: $EL.outerHTML = $X
          - pattern: $EL.insertAdjacentHTML(...)
          - pattern: document.write(...)
      # Only the setHTML function in the trusted-html package may write markup.
      - pattern-not-inside: |
          export function setHTML(...) { ... }
