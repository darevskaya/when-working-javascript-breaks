<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign-in widget</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/orbit.css" />
    <!-- Only this script differs between the widget pages. -->
    <script src="/innerhtml-escaped.js" defer></script>
  </head>
  <body>
    <main class="lab">
      <section class="demo-panel" aria-labelledby="page-title">
        <h1 id="page-title">Sign-in widget</h1>
        <p>The page gives the widget this element and the site name.</p>
        <section
          class="orbit-slot"
          aria-label="Sign in"
          data-orbit-widget
          data-shop="Fern &amp; Co."
        >
          <p class="orbit-loading">Loading sign-in…</p>
        </section>
      </section>
    </main>
  </body>
</html>
