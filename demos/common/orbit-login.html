<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit ID — Demo sign-in</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/orbit-login.css" />
    <script type="module" src="/orbit-login.js"></script>
  </head>
  <body class="auth-provider">
    <header class="provider-brand">
      <strong>Orbit ID</strong>
      <span>Demo identity provider</span>
    </header>
    <main class="provider-content">
      <section aria-labelledby="provider-title">
        <h1 id="provider-title">Sign in with Orbit ID</h1>
        <p id="provider-intro" class="provider-intro">
          You are now on Orbit ID, a separate service from the app that opened
          this window.
        </p>
        <div class="provider-account">
          <span class="provider-avatar" aria-hidden="true">E</span>
          <div>
            <strong>Elena</strong><span>Demo account · No password needed</span>
          </div>
        </div>
        <button id="complete-login" type="button">Continue as Elena</button>
        <p id="status" role="status">
          Continue to send your name to the app and close this window.
        </p>
        <aside
          id="provider-connection"
          class="provider-connection"
          aria-label="Connection to the app"
        >
          <h2>Connection to the app</h2>
          <p>
            <code>window.opener: <output id="opener-state">—</output></code>
          </p>
          <p id="connection-description"></p>
        </aside>
      </section>
    </main>
  </body>
</html>
