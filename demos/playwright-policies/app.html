<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Two features under policy</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="lab">
      <section class="demo-panel" aria-labelledby="page-title">
        <h1 id="page-title">Two features under policy</h1>
        <p>
          The page starts a Worker from a Blob URL, and it asks whether the page
          may use geolocation. The headers on this response decide both.
        </p>
        <dl class="checks">
          <dt>Blob worker</dt>
          <dd id="worker-status">Starting…</dd>
          <dt>Geolocation</dt>
          <dd id="geolocation-status">Asking…</dd>
        </dl>
        <h2>Reports the browser made</h2>
        <ul id="reports" aria-live="polite"></ul>
        <p id="reports-empty">No report yet.</p>
      </section>
    </main>
  </body>
</html>
