<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>An iframe under policy</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/checks.css" />
    <script type="module" src="/iframe.js"></script>
  </head>
  <body>
    <main class="lab">
      <section class="demo-panel" aria-labelledby="page-title">
        <h1 id="page-title">An iframe under policy</h1>
        <p>
          This page embeds another page in an iframe. The
          <code>frame-ancestors</code> directive on the embedded response
          decides whether the browser shows it.
        </p>
        <dl class="checks">
          <dt>Iframe</dt>
          <dd id="iframe-status">Loading…</dd>
        </dl>
        <iframe
          id="frame"
          src="/demo/playwright-policies/framed"
          title="Embedded page"
        ></iframe>
      </section>
    </main>
  </body>
</html>
