<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Popup login with BroadcastChannel</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/broadcast.css" />
    <script type="module" src="/broadcast.js"></script>
  </head>
  <body>
    <main class="lab">
      <section class="demo-panel" aria-labelledby="broadcast-title">
        <h1 id="broadcast-title">Popup login with BroadcastChannel</h1>
        <button id="sign-in" type="button">Sign in</button>
        <p id="status" role="status">Ready</p>
        <p class="window-state">
          <code
            >window.open() returned: <output id="open-result">—</output></code
          >
        </p>
      </section>
    </main>
  </body>
</html>
